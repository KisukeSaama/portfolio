# Single-service production stack. Traefik terminates TLS and routes the public hostname to Next.js.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}
    logging: *logging
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: https://${APP_HOST}
    networks:
      - traefik
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/en/legal >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.entrypoints=websecure
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.tls=true
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.tls.certresolver=letsencrypt
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.service=${APP_SUBDOMAIN}-${DEPLOY_ENV}
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.middlewares=${APP_SUBDOMAIN}-${DEPLOY_ENV}-ratelimit,${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers
      - traefik.http.services.${APP_SUBDOMAIN}-${DEPLOY_ENV}.loadbalancer.server.port=3000
      # The application sets the same headers itself, in app/lib/security-headers.ts. They are
      # repeated here because the proxy matcher skips a few routes (robots.txt, sitemap.xml, the
      # manifest, the social card) and all of /_next, and those responses leave the container bare.
      # Keep the two lists in step: whichever writes last is the value the browser reads.
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.frameDeny=true
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.stsPreload=true
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.customResponseHeaders.Permissions-Policy=accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.customResponseHeaders.Cross-Origin-Opener-Policy=same-origin
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.customResponseHeaders.Cross-Origin-Resource-Policy=same-origin
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.customResponseHeaders.X-DNS-Prefetch-Control=off
      # Every page is server rendered, so one client can keep the event loop busy on its own. The
      # allowance is per source address and counts assets as well as documents, so the burst has to
      # cover a cold first load, which pulls the document plus its chunks, fonts and images at once.
      # A crawler that trips the limit is slowed, not blocked.
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-ratelimit.ratelimit.average=120
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-ratelimit.ratelimit.burst=240
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-ratelimit.ratelimit.period=1m

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
