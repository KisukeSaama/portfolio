# Deployed stack. There is no nginx here on purpose: Traefik is the only reverse proxy on the
# host, and Next.js already rewrites /api/* to the backend (see frontend/next.config.ts), so the
# public entrypoint is the web container alone. The security headers nginx used to add locally are
# reproduced as a Traefik middleware below.
#
# Docker's default json-file driver keeps every line ever written; on a host that stays up for
# months that file fills the disk before the database does. 10 MB across 3 files caps each service
# at 30 MB and still leaves days of history for reading after an incident.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}
    logging: *logging
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: https://${APP_HOST}
      INTERNAL_API_BASE_URL: http://backend:8080/api/v1
      API_PROXY_TARGET: http://backend:8080
    networks:
      - application
      - traefik
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/en/legal >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # The standalone server writes nothing outside /tmp: everything it serves was baked into the
    # image, and uploads are written to the backend's media volume.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.rule=Host(`${APP_HOST}`)
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.entrypoints=websecure
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.tls=true
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.tls.certresolver=letsencrypt
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.service=${APP_SUBDOMAIN}-${DEPLOY_ENV}
      - traefik.http.routers.${APP_SUBDOMAIN}-${DEPLOY_ENV}.middlewares=${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers
      - traefik.http.services.${APP_SUBDOMAIN}-${DEPLOY_ENV}.loadbalancer.server.port=3000
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.frameDeny=true
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.customResponseHeaders.Permissions-Policy=camera=(), microphone=(), geolocation=(), payment=()
      # Quoted because the CSP contains "data: " and "https: " — unquoted, YAML reads the first
      # colon-space as a mapping and compose rejects the label as a map instead of a string.
      - "traefik.http.middlewares.${APP_SUBDOMAIN}-${DEPLOY_ENV}-headers.headers.contentSecurityPolicy=default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'"

  backend:
    image: ${CI_REGISTRY_IMAGE}/backend:${IMAGE_TAG}
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      MEDIA_DIR: /var/lib/portfolio/media
      PROJECT_SEED_ENABLED: ${PROJECT_SEED_ENABLED:-true}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    networks:
      - application
    volumes:
      - ${DATA_DIR}/${DEPLOY_ENV}/media:/var/lib/portfolio/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR}/${DEPLOY_ENV}/postgres:/var/lib/postgresql/data
    networks:
      - application
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

networks:
  # The database and the two applications talk on a network with no route out. Nothing here needs
  # egress: media is stored on a local volume, so no service calls out to the internet.
  application:
    internal: true
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
