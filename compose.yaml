services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5173}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5173}
    ports:
      - "5173:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/en/legal >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
