services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:5173}
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - portfolio_node_modules:/workspace/node_modules
      - portfolio_next:/workspace/.next
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173/en/legal >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  portfolio_node_modules:
  portfolio_next:
