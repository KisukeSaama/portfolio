spring:
  application:
    name: portfolio-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${POSTGRES_USER:portfolio}
    password: ${POSTGRES_PASSWORD:portfolio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: ${SESSION_TIMEOUT:12h}
  servlet:
    multipart:
      max-file-size: 40MB
      max-request-size: 42MB
  data:
    web:
      pageable:
        # Without a ceiling, ?size=1000000 turns a paged admin listing into a full-table read.
        max-page-size: 100
        default-page-size: 20
server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    session:
      cookie:
        name: PORTFOLIO_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  security:
    # Number of reverse proxies between the internet and this service. It decides which
    # X-Forwarded-For entry is the real client: everything left of that is caller-supplied.
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:1}
  seed:
    enabled: ${PROJECT_SEED_ENABLED:true}
  storage:
    directory: ${MEDIA_DIR:./data/media}
    max-image-bytes: 8388608
    max-video-bytes: 41943040
