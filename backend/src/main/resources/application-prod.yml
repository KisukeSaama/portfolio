server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        secure: true
logging:
  level:
    root: WARN
    com.jonathan.portfolio: INFO
# Swagger UI and the OpenAPI document describe every administration endpoint, including the shape
# of each request body. They are a development aid and stay off where the site is public.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
spring:
  jpa:
    properties:
      hibernate:
        format_sql: false
