services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
    ports: ["5432:5432"]
    volumes: ["portfolio-postgres-dev:/var/lib/postgresql/data"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    profiles: ["apps"]
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio}
      MEDIA_DIR: /var/lib/portfolio/media
      SESSION_COOKIE_SECURE: "false"
      # Published straight to the host, with no proxy in front to vouch for X-Forwarded-For.
      TRUSTED_PROXY_COUNT: "0"
    ports: ["8080:8080"]
    volumes: ["portfolio-media-dev:/var/lib/portfolio/media"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  portfolio-postgres-dev:
  portfolio-media-dev:
