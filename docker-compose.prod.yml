services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["portfolio-postgres-prod:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_COOKIE_SECURE: "true"
      # nginx is the only hop, and it overwrites X-Forwarded-For rather than appending to it.
      TRUSTED_PROXY_COUNT: "1"
      MEDIA_DIR: /var/lib/portfolio/media
      PROJECT_SEED_ENABLED: ${PROJECT_SEED_ENABLED:-true}
    volumes: ["portfolio-media-prod:/var/lib/portfolio/media"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP",
        ]
      interval: 15s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      INTERNAL_API_BASE_URL: http://backend:8080/api/v1
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/en/legal >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12

  reverse-proxy:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports: ["80:8080"]
    volumes:
      - ./infra/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/reverse-proxy/proxy-common.conf:/etc/nginx/conf.d/proxy-common.conf:ro
    depends_on:
      frontend: { condition: service_healthy }
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/en/legal >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  portfolio-postgres-prod:
  portfolio-media-prod:
