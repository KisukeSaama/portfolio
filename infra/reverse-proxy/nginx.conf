worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  upstream frontend { server frontend:3000; keepalive 16; }
  upstream backend { server backend:8080; keepalive 16; }

  server {
    listen 8080;
    client_max_body_size 42m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # No Content-Security-Policy here. The application sets a per-request policy with a script
    # nonce (frontend/app/lib/csp.ts), and a browser enforces every policy it is given: a second,
    # static one here would have to allow 'unsafe-inline' and would only ever narrow the first.

    location = /api/v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://backend;
      include /etc/nginx/conf.d/proxy-common.conf;
    }

    location /api/ {
      proxy_pass http://backend;
      include /etc/nginx/conf.d/proxy-common.conf;
      proxy_request_buffering off;
    }

    location /actuator/health {
      proxy_pass http://backend;
      include /etc/nginx/conf.d/proxy-common.conf;
    }

    location / {
      proxy_pass http://frontend;
      include /etc/nginx/conf.d/proxy-common.conf;
    }
  }
}
