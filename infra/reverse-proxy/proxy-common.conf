proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwritten, not appended. $proxy_add_x_forwarded_for keeps whatever the caller sent and adds to
# it, which makes the leftmost entry caller-controlled; a caller that changes it per request then
# gets a fresh bucket from anything that rate limits by address. This proxy is the only hop, so the
# peer address is the whole truth. Add a hop here and app.security.trusted-proxy-count must follow.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Pinned for the same reason: without it a caller-supplied X-Forwarded-Host reaches the backend,
# which trusts forwarded headers to rebuild absolute URLs.
proxy_set_header X-Forwarded-Host $host;
proxy_set_header Connection "";
proxy_read_timeout 60s;
