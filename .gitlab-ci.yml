image: docker:29

# Frontend-only portfolio pipeline:
# - checks run on develop, merge requests and version tags;
# - one Next.js image is built on develop and version tags;
# - DEV deploys manually from develop, PROD automatically from version tags.
stages:
  - test
  - build
  - deploy

variables:
  APP_SUBDOMAIN: portfolio
  PROD_HOST: kisukesaama.com
  DOCKER_BUILDKIT: "1"
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""

.docker_defaults: &docker_defaults
  image: docker:29
  tags: [devops]
  before_script:
    - set -euo pipefail
    - docker info
    - |
      if [[ -z "${CI_REGISTRY:-}" ]]; then
        echo "CI_REGISTRY is not set." >&2
        exit 1
      fi
    - export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}"
    - export IMAGE_TAG="${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}}"
    - echo "${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}" | docker login --username "${CI_REGISTRY_USER:-gitlab-ci-token}" --password-stdin "${CI_REGISTRY}"

.deploy_defaults: &deploy_defaults
  image: docker:29
  tags: [devops]
  before_script:
    - set -euo pipefail
    - docker info
    - |
      if [[ -z "${CI_REGISTRY:-}" ]]; then
        echo "CI_REGISTRY is not set." >&2
        exit 1
      fi
    - export CI_REGISTRY_IMAGE="${CI_REGISTRY_IMAGE:-${CI_REGISTRY}/${CI_PROJECT_PATH}}"
    - export IMAGE_TAG="${CI_COMMIT_TAG:-${CI_COMMIT_REF_SLUG}}"
    - set -a; source deploy/paths.env; set +a
    - |
      if [[ -n "${CI_COMMIT_TAG:-}" ]]; then
        export DEPLOY_ENV=prod
        export APP_HOST="${PROD_HOST}"
      else
        export DEPLOY_ENV=dev
        export APP_HOST="${APP_SUBDOMAIN}-d.kisukesaama.com"
      fi
    - export TARGET_DIR="${DEPLOY_DIR}/${DEPLOY_ENV}"
    - |
      case "${DEPLOY_DIR:-}" in
        /home/kisuke/*) ;;
        *) echo "DEPLOY_DIR must stay under /home/kisuke/." >&2; exit 1 ;;
      esac
      case "${DEPLOY_DIR}" in
        *..*) echo "DEPLOY_DIR cannot contain '..'." >&2; exit 1 ;;
      esac

      mkdir -p "${TARGET_DIR}"
      cp deploy/compose.yml "${TARGET_DIR}/compose.yml"
      cp deploy/paths.env "${TARGET_DIR}/paths.env"
      printf '%s\n' \
        "DEPLOY_ENV=${DEPLOY_ENV}" \
        "APP_HOST=${APP_HOST}" \
        "CI_REGISTRY_IMAGE=${CI_REGISTRY_IMAGE}" \
        "IMAGE_TAG=${IMAGE_TAG}" \
        > "${TARGET_DIR}/app.env"

      target_rel="${TARGET_DIR#/home/kisuke/}"
      tar -C "${TARGET_DIR}" -cf - . | docker run --rm -i \
        -e TARGET_REL="${target_rel}" \
        -v /home/kisuke:/host-home \
        alpine:3.24 sh -euc '
          case "$TARGET_REL" in ""|/*|*..*) exit 1 ;; esac
          host_target="/host-home/$TARGET_REL"
          mkdir -p "$host_target"
          tar -C "$host_target" -xf -
          chmod 750 "$host_target"
          chmod 640 "$host_target/compose.yml" "$host_target/paths.env" "$host_target/app.env"
        '
    - echo "${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}" | docker login --username "${CI_REGISTRY_USER:-gitlab-ci-token}" --password-stdin "${CI_REGISTRY}"
    - |
      compose() {
        docker compose -p "${APP_SUBDOMAIN}-${DEPLOY_ENV}" \
          --env-file paths.env --env-file app.env -f compose.yml "$@"
      }

      deploy() {
        compose pull
        compose up -d --remove-orphans && return 0
        compose ps -a >&2 || true
        compose logs --no-color --tail 200 >&2 || true
        return 1
      }

test:
  stage: test
  tags: [devops]
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  cache:
    key: portfolio-npm
    paths: [.npm]
  before_script:
    - npm config set cache "$CI_PROJECT_DIR/.npm"
  script:
    - npm ci --no-audit --no-fund
    - npm audit --audit-level=moderate
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run test:e2e
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  <<: *docker_defaults
  needs: [test]
  script:
    - >-
      docker build --pull
      --build-arg PUBLIC_SITE_URL="https://${PROD_HOST}"
      -t "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}" -f Dockerfile .
    - docker push "${CI_REGISTRY_IMAGE}/web:${IMAGE_TAG}"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG =~ /^v.*/'

deploy_dev:
  stage: deploy
  <<: *deploy_defaults
  needs: [build]
  resource_group: portfolio-dev
  environment:
    name: dev
    url: https://portfolio-d.kisukesaama.com
    on_stop: stop_dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - deploy

stop_dev:
  stage: deploy
  <<: *deploy_defaults
  resource_group: portfolio-dev
  environment:
    name: dev
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - compose down

deploy_prod:
  stage: deploy
  <<: *deploy_defaults
  needs: [build]
  resource_group: portfolio-prod
  environment:
    name: production
    url: https://kisukesaama.com
    on_stop: stop_prod
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
  script:
    - cd "${TARGET_DIR}"
    - deploy

stop_prod:
  stage: deploy
  <<: *deploy_defaults
  resource_group: portfolio-prod
  environment:
    name: production
    action: stop
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v.*/'
      when: manual
  script:
    - cd "${TARGET_DIR}"
    - compose down
